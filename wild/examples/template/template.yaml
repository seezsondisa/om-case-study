apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: example-nodejs-template
  title: Example Node.js Template
  description: An example template for the scaffolder that creates a simple Node.js service
spec:
  owner: user:guest
  type: service

  # These parameters are used to generate the input form in the frontend, and are
  # used to gather input data for the execution of the template.
  parameters:
    - title: Fill in some steps
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:field: EntityNamePicker
          ui:autofocus: true
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  # These steps are executed in the scaffolder backend, using data that we gathered
  # via the parameters above.
  #
  # Per the case study brief, this template's only step is the custom
  # `my:custom:action` action (id `my:custom:action`), which creates a new
  # file in the template's temp workspace directory.
  steps:
    - id: my-custom-action
      name: My Custom Action
      action: my:custom:action
      input:
        filename: 'hello-from-custom-action.txt'
        content: 'Created by my:custom:action for ${{ parameters.name }}\n'

  # Outputs are displayed to the user after a successful execution of the template.
  output:
    links:
      - title: Created file path
        url: ${{ steps['my-custom-action'].output.path }}
